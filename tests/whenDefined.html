<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>When Defined</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc src="be-gone/emc.json"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <div be-gone-when-defined="my-component">
        <label id=label>I am here</label>
    </div>
    <div id=target></div>
    <button onclick="define()">Define</button>
    <script>
        function runTest(){
            customElements.define('my-component', class extends HTMLElement{});
            setTimeout(() => {
                if(document.querySelector('[be-gone-when-defined]') === null){
                    target.setAttribute('mark', 'good');
                }
            }, 16);
        }
        setTimeout(() => {
            runTest();
        }, 500);
    </script>
</body>
</html>
